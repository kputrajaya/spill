<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="color-scheme" content="light" />
  <title>Settle Bills</title>

  <link rel="icon" href="../favicon-16.png" sizes="16x16" />
  <link rel="icon" href="../favicon-32.png" sizes="32x32" />
  <link rel="icon" href="../favicon-96.png" sizes="96x96" />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
  <link href="../site.css" rel="stylesheet" />
  <link href="settle.css" rel="stylesheet" />

  <script src="https://cdn.jsdelivr.net/npm/@alpinejs/persist@3.17.5/dist/cdn.min.js" defer
    integrity="sha384-wQUPtgVWygGHRobHJvRb7RggcyyXvTpDpB2OwTm2IycjV37YIv9UzhpzQqWwvPzz"
    crossorigin="anonymous"></script>
  <script src="https://kputrajaya.github.io/pubsub/sdk.js" defer></script>
  <script src="../shared.js" defer></script>
  <script src="settle.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.17.5/dist/cdn.min.js" defer
    integrity="sha384-FYLKjwG3aohNhNZoVG8sY/5ntunm+MqylL90Q+rT3OM7AwV9/BKFjk/RjoIpIgsI"
    crossorigin="anonymous"></script>
</head>

<body>
  <div class="container page" x-data="settle" :class="{ 'has-sheet': formOpen, 'has-add': !formOpen }" x-cloak>
    <header class="page-head">
      <h1>&#129309; Settle Bills</h1>
      <div class="head-actions">
        <a class="btn btn-quiet btn-sm" href="/">Split bill &rarr;</a>
      </div>
    </header>

    <!-- Balances -->
    <section class="surface">
      <div class="section-head">
        <span class="section-title">Balances</span>
        <div class="d-flex flex-wrap align-items-center justify-content-end gap-2">
          <button class="btn btn-quiet btn-sm" type="button" @click="openSettings()">
            Edit people
          </button>
          <button class="btn btn-quiet btn-sm" type="button" title="Copy a link that syncs this ledger across devices"
            @click="copySyncLink()">
            Copy sync link
          </button>
        </div>
      </div>

      <div class="table-wrap">
        <table class="tbl">
          <thead>
            <tr>
              <th scope="col" class="t-start"><span class="visually-hidden">Metric</span></th>
              <template x-for="row in balanceRows" :key="row.id">
                <th scope="col" x-text="row.name"></th>
              </template>
            </tr>
          </thead>
          <tbody>
            <tr>
              <th scope="row" class="t-start">Paid</th>
              <template x-for="row in balanceRows" :key="row.id">
                <td x-text="formatAmount(row.paid)"></td>
              </template>
            </tr>
            <tr>
              <th scope="row" class="t-start">Spent</th>
              <template x-for="row in balanceRows" :key="row.id">
                <td x-text="formatAmount(row.spent)"></td>
              </template>
            </tr>
            <tr>
              <th scope="row" class="t-start">Balance</th>
              <template x-for="row in balanceRows" :key="row.id">
                <td class="t-strong" :class="{ 'is-positive': row.balance > 0, 'is-negative': row.balance < 0 }"
                  x-text="formatAmount(row.balance)"></td>
              </template>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="input-footer">
        <div class="form-check form-switch m-0">
          <input class="form-check-input" type="checkbox" id="settleRoundWholeInput" x-model="roundWhole" />
          <label class="form-check-label help" for="settleRoundWholeInput">Round numbers</label>
        </div>
      </div>
    </section>

    <!-- Settlement -->
    <section class="surface">
      <div class="section-head">
        <span class="section-title">Settlement</span>
        <button class="btn btn-quiet btn-sm" type="button" x-show="transfers.length" @click="copySettlement">
          Copy summary
        </button>
      </div>

      <p class="help mb-0" x-show="!transfers.length" role="status" aria-live="polite">
        No settlement needed
      </p>

      <div class="table-wrap" x-show="transfers.length">
        <table class="tbl tbl-settle">
          <thead>
            <tr>
              <th scope="col" class="t-start">From</th>
              <th scope="col" class="t-start">To</th>
              <th scope="col">Amount</th>
              <th scope="col"><span class="visually-hidden">Actions</span></th>
            </tr>
          </thead>
          <tbody>
            <template x-for="(transfer, index) in transfers" :key="index">
              <tr>
                <td class="t-start" x-text="transfer.from"></td>
                <td class="t-start" x-text="transfer.to"></td>
                <td x-text="formatAmount(transfer.amount)"></td>
                <td>
                  <button type="button" class="btn-x" title="Settle this balance" aria-label="Settle this balance"
                    @click="closeTransfer(transfer)">
                    &times;
                  </button>
                </td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
    </section>

    <!-- Transactions -->
    <section class="surface">
      <div class="section-head">
        <span class="section-title">Transactions</span>
        <div class="d-flex align-items-center gap-2">
          <button class="btn btn-quiet btn-sm" type="button" x-show="state.transactions.length"
            @click="clearTransactions()">
            Clear all
          </button>
        </div>
      </div>

      <p class="help help-warn mt-2 mb-2" x-show="transactionWarning" x-text="transactionWarning" role="status"></p>

      <p class="help mb-0" x-show="!state.transactions.length">
        No transactions yet. Add one below.
      </p>

      <div class="table-wrap" x-show="state.transactions.length">
        <table class="tbl">
          <thead>
            <tr>
              <th scope="col" class="t-start">Name</th>
              <th scope="col">Total</th>
              <template x-for="person in state.people" :key="person.id">
                <th scope="col" x-text="person.name"></th>
              </template>
              <th scope="col" class="t-center"><span class="visually-hidden">Actions</span></th>
            </tr>
          </thead>
          <tbody>
            <template x-for="transaction in sortedTransactions" :key="transaction.id">
              <tr class="txn-row" @click="editTransaction(transaction)" title="Edit transaction">
                <td class="t-start">
                  <span x-text="transaction.name"></span>
                  <span class="txn-date" x-text="formatDate(transaction.createdAt)"></span>
                </td>
                <td x-text="formatMinor(transaction.amount)"></td>
                <template x-for="person in state.people" :key="person.id">
                  <td>
                    <span class="payer-badge" title="Paid this transaction"
                      x-show="transaction.payerId === person.id">P</span>
                    <span x-text="shareCell(transaction, person.id)"></span>
                  </td>
                </template>
                <td class="t-center">
                  <button type="button" class="btn-x" title="Delete this transaction"
                    aria-label="Delete this transaction" @click.stop="deleteTransaction(transaction)">
                    &times;
                  </button>
                </td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>

      <!-- Add / edit form -->
      <template x-if="formOpen">
        <div class="txn-sheet">
          <div class="txn-sheet-body">
            <div class="field-block">
              <label class="field-label" for="txnAmount">Amount</label>
              <input id="txnAmount" class="form-control" type="text" inputmode="decimal" autocomplete="off"
                placeholder="100000" x-model="form.amount" @input="form.error = null" :aria-invalid="!!form.error" />
              <p class="help help-warn mt-2 mb-0" x-show="form.amount && !(formAmountMinor > 0)" role="alert">
                Enter a valid amount.
              </p>
            </div>

            <div class="row g-2">
              <div class="col-12 col-sm-6 field-block">
                <label class="field-label" for="txnName">Transaction name (optional)</label>
                <input id="txnName" class="form-control" type="text" maxlength="40" placeholder="Bill"
                  x-model="form.name" @input="form.error = null" />
              </div>

              <div class="col-12 col-sm-6 field-block">
                <label class="field-label" for="txnPayer">Who paid?</label>
                <select id="txnPayer" class="form-select" x-model="form.payerId" @change="form.error = null">
                  <option value="" disabled hidden>Pick someone</option>
                  <template x-for="person in formPayerOptions" :key="person.id">
                    <option :value="person.id" x-text="person.name"></option>
                  </template>
                </select>
              </div>
            </div>

            <div class="field-block">
              <span class="field-label">How to split</span>
              <div class="mode-row" role="group" aria-label="How to split the amount">
                <button type="button" class="chip" :class="{ 'is-on': form.mode === 'owed' }"
                  :aria-pressed="form.mode === 'owed'" @click="setMode('owed')">
                  To non-payers
                </button>
                <button type="button" class="chip" :class="{ 'is-on': form.mode === 'equal' }"
                  :aria-pressed="form.mode === 'equal'" @click="setMode('equal')">
                  To everyone
                </button>
                <button type="button" class="chip" :class="{ 'is-on': form.mode === 'manual' }"
                  :aria-pressed="form.mode === 'manual'" @click="setMode('manual')">
                  Input manually
                </button>
              </div>
              <p class="help mt-2 mb-0" x-text="formModeHelp"></p>
            </div>

            <div class="field-block" x-show="form.mode === 'manual'">
              <div class="manual-list">
                <template x-for="person in formPayerOptions" :key="person.id">
                  <div class="manual-row">
                    <label class="manual-name" :for="`manual-${person.id}`">
                      <span x-text="person.name"></span>
                      <span class="split-note" x-show="person.id === form.payerId">own share</span>
                    </label>
                    <input :id="`manual-${person.id}`" class="form-control" type="text" inputmode="decimal"
                      placeholder="0" x-model="form.manual[person.id]" @input="form.error = null" />
                  </div>
                </template>
              </div>
            </div>

            <p class="help help-warn mt-3 mb-0" x-show="form.error" x-text="form.error" role="alert"></p>

            <div class="form-actions">
              <span class="help form-inline-error" x-show="formInlineError" x-text="formInlineError" role="status"
                aria-live="polite"></span>
              <div class="form-action-buttons">
                <button class="btn btn-accent" type="button" :disabled="!formCanSave" @click="saveTransaction()">
                  Save
                </button>
                <button class="btn btn-quiet" type="button" @click="cancelForm()">Cancel</button>
              </div>
            </div>
          </div>
        </div>
      </template>

      <template x-if="!formOpen">
        <div class="add-float">
          <button class="btn btn-accent" type="button" @click="startAdd()">Add transaction</button>
        </div>
      </template>
    </section>

    <!-- People settings -->
    <dialog class="settle-dialog" x-ref="settingsDialog" aria-labelledby="settingsTitle" @click.self="closeSettings()"
      @cancel.prevent="closeSettings()">
      <div class="dialog-body">
        <div class="section-head">
          <span class="section-title" id="settingsTitle">Edit people</span>
        </div>

        <p class="help">These names are used for new and existing transactions.</p>

        <div class="settings-list">
          <template x-for="person in settingsDraft" :key="person.id">
            <div class="settings-row">
              <input class="form-control" type="text" maxlength="24" aria-label="Person name" x-model="person.name" />
              <button class="btn-x" type="button" title="Remove person" aria-label="Remove person"
                @click="removeDraftPerson(person)">
                &times;
              </button>
            </div>
          </template>
        </div>

        <div class="settings-add">
          <input class="form-control" type="text" maxlength="24" placeholder="Add person" x-model="newName"
            @keydown.enter.prevent="addDraftPerson()" />
          <button class="btn btn-quiet" type="button" @click="addDraftPerson()">Add</button>
        </div>

        <p class="help help-warn mt-3 mb-0" x-show="settingsError" x-text="settingsError" role="alert"></p>
      </div>
    </dialog>
  </div>

  <div id="toastStack" class="toast-stack" role="status" aria-live="polite" aria-atomic="true"></div>
</body>

</html>
