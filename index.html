<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="color-scheme" content="light" />
  <title>Split Bill</title>

  <link rel="icon" href="favicon-16.png" sizes="16x16" />
  <link rel="icon" href="favicon-32.png" sizes="32x32" />
  <link rel="icon" href="favicon-96.png" sizes="96x96" />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
  <link href="site.css" rel="stylesheet" />

  <script src="https://cdn.jsdelivr.net/npm/@alpinejs/persist@3.17.5/dist/cdn.min.js" defer
    integrity="sha384-wQUPtgVWygGHRobHJvRb7RggcyyXvTpDpB2OwTm2IycjV37YIv9UzhpzQqWwvPzz"
    crossorigin="anonymous"></script>
  <script src="shared.js" defer></script>
  <script src="site.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.17.5/dist/cdn.min.js" defer
    integrity="sha384-FYLKjwG3aohNhNZoVG8sY/5ntunm+MqylL90Q+rT3OM7AwV9/BKFjk/RjoIpIgsI"
    crossorigin="anonymous"></script>
</head>

<body>
  <div class="container page" x-data="spill">
    <header class="page-head flex-wrap">
      <div class="page-title">
        <span class="page-mark" aria-hidden="true">&#128176;</span>
        <div class="page-title-text">
          <h1>Split Bill</h1>
          <p class="page-subtitle">Split amounts in seconds.</p>
        </div>
      </div>
      <div class="d-flex flex-wrap align-items-center justify-content-end gap-2">
        <a class="nav-link" href="/settle/">Go to Settle &rarr;</a>
      </div>
    </header>
    <input x-ref="receiptInput" type="file" accept="image/*" hidden @change="scanReceipt($event)" />

    <!-- Input -->
    <section class="surface">
      <div class="section-head">
        <span class="section-title">Input</span>
        <button class="btn btn-accent btn-sm" type="button" :disabled="scanning"
          @click="$refs.receiptInput.click()">
          <span x-text="scanning ? 'Scanning...' : 'Scan receipt'"></span>
        </button>
      </div>

      <div class="field-block">
        <label class="field-label" for="namesInput">
          People
        </label>
        <input id="namesInput" class="form-control" type="text" autocomplete="off" placeholder="JOHN JANE"
          x-model="nameText" @blur="normalizeNames()" />
      </div>

      <div class="field-block">
        <div class="items-split">
          <div class="items-prices">
            <label class="field-label" for="itemsInput">
              Item prices
            </label>
            <textarea id="itemsInput" class="form-control list-input" rows="2" wrap="off" placeholder="20000&#10;30000"
              x-model="itemText"></textarea>
          </div>

          <div class="items-assign" x-show="assignmentItems.length && people.length">
            <div class="item-chips-list">
              <template x-for="row in chipRows" :key="row.key">
                <div class="item-chips">
                  <button type="button" class="chip" x-show="!row.placeholder"
                    :class="{ 'is-on': !row.placeholder && row.shareCount === 0 }" @click="shareEveryone(row.index)"
                    aria-label="Shared by everyone" :aria-pressed="!row.placeholder && row.shareCount === 0">
                    All
                  </button>
                  <template x-for="person in people" :key="person">
                    <button type="button" class="chip" x-show="!row.placeholder"
                      :class="{ 'is-on': row.shares[person] > 0 }" @click="cycleShare(row.index, person)"
                      :aria-pressed="row.shares[person] > 0">
                      <span x-text="person"></span>
                      <span class="chip-weight" x-show="row.shares[person] > 1"
                        x-text="`×${row.shares[person]}`"></span>
                    </button>
                  </template>
                </div>
              </template>
            </div>
          </div>
        </div>

        <p class="help help-warn mt-2 mb-0" x-show="warning" x-text="warning" role="status" aria-live="polite"></p>
      </div>

      <div class="field-block">
        <label class="field-label" for="totalInput">
          Total
        </label>
        <input id="totalInput" class="form-control" type="text" inputmode="decimal" autocomplete="off"
          placeholder="55000" x-model="totalPaid" :aria-invalid="!!error"
          :aria-describedby="error ? 'totalError' : null" />
        <p id="totalError" class="help help-warn mt-2 mb-0" x-show="error" x-text="error" role="alert"></p>
      </div>

      <div class="input-footer">
        <div class="form-check form-switch m-0">
          <input class="form-check-input" type="checkbox" id="roundWholeInput" x-model="roundWhole" />
          <label class="form-check-label help" for="roundWholeInput">Whole numbers</label>
        </div>
      </div>
    </section>

    <!-- Result -->
    <section class="surface">
      <div class="section-head">
        <span class="section-title">Result</span>
        <template x-if="bill">
          <div class="d-flex flex-wrap justify-content-end gap-2">
            <button class="btn btn-quiet btn-sm" type="button" @click="settleInNewTab">Send to Settle</button>
            <button class="btn btn-quiet btn-sm" type="button" @click="copyBillSummary">Copy summary</button>
          </div>
        </template>
      </div>

      <template x-if="!bill">
        <p class="help mb-0">Add prices and people to see the split.</p>
      </template>

      <template x-if="bill">
        <div class="table-wrap">
          <table class="tbl">
            <thead>
              <tr>
                <th scope="col" class="t-start">No</th>
                <th scope="col">Price</th>
                <th scope="col">
                  W.&nbsp;fee&nbsp;(<span x-text="formatFee(bill.feePercent)"></span>%)
                </th>
                <template x-for="person in bill.people" :key="person">
                  <th scope="col" class="t-person" x-text="person"></th>
                </template>
              </tr>
            </thead>
            <tbody>
              <template x-for="item in bill.items" :key="item.index">
                <tr>
                  <td class="t-start" x-text="item.index + 1"></td>
                  <td x-text="formatAmount(item.price)"></td>
                  <td x-text="formatAmount(item.priceWithFee)"></td>
                  <template x-for="person in bill.people" :key="person">
                    <td x-text="formatAmount(item.shares[person])"></td>
                  </template>
                </tr>
              </template>
            </tbody>
            <tfoot>
              <tr>
                <th scope="row" class="t-start">Total</th>
                <th scope="col" x-text="formatAmount(bill.subtotal)"></th>
                <th scope="col" x-text="formatAmount(bill.total)"></th>
                <template x-for="person in bill.people" :key="person">
                  <th scope="col" class="t-strong" x-text="formatAmount(bill.totals[person])"></th>
                </template>
              </tr>
            </tfoot>
          </table>
        </div>
      </template>
    </section>

  </div>
  <div id="toastStack" class="toast-stack" role="status" aria-live="polite" aria-atomic="true"></div>
</body>

</html>
